[workspace]
resolver = "2"
members = [
    "crates/auth",
    "crates/protocol",
    "crates/policy",
    "crates/sandbox-linux",
    "crates/executor",
    "crates/jobstore",
    "crates/coordinator",
    "crates/worker",
    "crates/cli",
    "crates/runtime",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
agent-auth = { path = "crates/auth" }
agent-executor = { path = "crates/executor" }
agent-jobstore = { path = "crates/jobstore" }
agent-policy = { path = "crates/policy" }
agent-protocol = { path = "crates/protocol" }
agent-sandbox-linux = { path = "crates/sandbox-linux" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hostname = "0.4"
nix = { version = "0.31", default-features = false, features = ["signal"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.27"
uuid = { version = "1", features = ["serde", "v4"] }
